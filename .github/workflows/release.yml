name: release

# Pushing a v<version> tag publishes the .bhm a player actually installs.
# Before this existed the repo had five pushed tags and zero releases, so the
# only install path was building a classic net48/x64 csproj on Windows - which
# the target audience (GW2 players running an overlay) will not do.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: nuget restore GW2CraftingHelper.sln

      # Platform=x64 is required, not stylistic: the project only defines
      # output paths for x64 and fails outright without it.
      - name: Build module (Release/x64)
        run: dotnet build GW2CraftingHelper.csproj -p:Platform=x64 -c Release

      # A tag whose version does not match the shipped manifest would publish a
      # .bhm that reports a different version in the About tab than the release
      # it came from. Fail here rather than ship that.
      - name: Check the tag matches manifest.json
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          manifest=$(jq -r .version manifest.json)
          echo "tag=$tag manifest=$manifest"
          if [ "$tag" != "$manifest" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match manifest.json version $manifest."
            exit 1
          fi

      # The release body is the CHANGELOG section for this version, so the
      # release notes cannot drift from the file that is already the release
      # record. An unmatched version is a hard failure for the same reason.
      - name: Extract the CHANGELOG section for this tag
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Prefix match by index, not regex: the dots in "0.2.4" would
          # otherwise be wildcards and match a heading that is not this release.
          awk -v h="## $version" '
            index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") {
              found = 1; next
            }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::No CHANGELOG.md section found for version $version."
            exit 1
          fi
          cat release-notes.md

      - name: Verify the .bhm was produced
        shell: bash
        run: |
          test -f bin/x64/Release/GW2CraftingHelper.bhm
          ls -l bin/x64/Release/GW2CraftingHelper.bhm

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: bin/x64/Release/GW2CraftingHelper.bhm
          body_path: release-notes.md
