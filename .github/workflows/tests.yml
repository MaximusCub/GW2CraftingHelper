name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: ASCII-only source check (advisory)
        shell: bash
        run: |
          echo "CLAUDE.md requires ASCII-only .cs source. Listing current violations below;"
          echo "this step is advisory (non-blocking) until the pre-existing violations it"
          echo "found are cleaned up in a follow-up pass - see M38 WP-02."
          violations=$(grep -rlP '[^\x00-\x7F]' --include='*.cs' . \
            | grep -v '^\./packages/' | grep -v '/obj/' | grep -v '/bin/' || true)
          if [ -n "$violations" ]; then
            echo "$violations"
          else
            echo "(clean - no non-ASCII characters found in .cs source)"
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore packages
        run: nuget restore GW2CraftingHelper.sln

      - name: Build module
        run: dotnet build GW2CraftingHelper.csproj -p:Platform=x64

      - name: Run tests
        run: dotnet test tests/GW2CraftingHelper.Tests/GW2CraftingHelper.Tests.csproj -c Release

      - name: Run recipe seeder tests
        run: dotnet test tests/GW2CraftingHelper.RecipeSeeder.Tests/GW2CraftingHelper.RecipeSeeder.Tests.csproj -p:Platform=x64 -c Release
